<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Track-Life</title>
    <link rel="shortcut icon" href="./android-chrome-192x192.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="main">



        <nav>

        </nav>

        <section class="allelem">
            <header>
                <div class="header1">
                     <h1></h1>
                        <h2></h2>
                        <h2 id="temp"></h2>
                        <h4></h4>

                </div>
                <div class="header2">
                    <h3></h3>
                    <h4 id="humi"></h4>
                    <h1></h1>
                </div>
            </header>
            <div class="allfeatures">

                <div class="todolist elem" id="0">
                    <img src="https://images.unsplash.com/photo-1789414514309-ee0d98533788?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                        alt="">
                    <h2>To Do list</h2>
                </div>
                <div class="Goals elem" id="1">
                    <img src="https://images.unsplash.com/photo-1653432085096-17e6cbc21572?q=80&w=681&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                        alt="">
                    <h2> Daily Goals </h2>
                </div>
                <!-- <div class="daily elem" id="2">
                <img src="https://images.unsplash.com/photo-1789320639631-6c85daad9b46?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
                <h2> Daily Planner</h2>
            </div> -->
                <div class="Pomodoro elem" id="2">
                    <img src="https://plus.unsplash.com/premium_photo-1725075086634-0037c3040c54?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                        alt="">
                    <h2> Pomodoro Timer</h2>
                </div>
                <div class="Moti elem" id="3">
                    <img src="https://images.unsplash.com/photo-1789007793855-7ba74161eb4b?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                        alt="">
                    <h2> Motivation </h2>
                </div>



            </div>


        </section>


        <section class="todo fullelem">
            <button class="back" id="0">Close</button>
            <h1> Your personalized todolist</h1>
            <div class="todo-container">

                <div class="addtask">
                    <form>
                        <input id="text-input" type="text" placeholder="Enter Task">
                        <textarea placeholder="Enter Details" name="" id=""></textarea>
                        <div class="mark">
                            <input type="checkbox" id="checkbox">
                            <label for="checkbox">Mark as Important!</label>
                        </div>
                        <button>Add Task</button>
                    </form>
                </div>
                <div class="alltask">


                </div>

            </div>
        </section>

        <section class="goal fullelem">
            <button class="back" id="1">Close</button>
            <h1> Daily goals </h1>

            <div class="day-planner">



            </div>


        </section>
        <!-- <section class="daily fullelem">
            <button class="back" id="2">Close</button>
            <h1> Daily planner </h1>
        </section> -->
        <section class="time fullelem">
            <button class="back" id="2">Close</button>
            <h1> Study With Me !</h1>
            <div class="work">
                <h3>Work-Time</h3>
            </div>
            <div class="pomodoro-timer">
                <h1></h1>
                <button class="start">START</button>
                <button class="pause">PAUSE</button>
                <button class="reset">RESET</button>
            </div>

        </section>
        <section class="moti fullelem">
            <button class="back" id="3">Close</button>
            <h1> Motivation</h1>
            <div class="motivation">
                <div class="motivation-wraper">
                    <div class="motivation-line">
                        <h2>Quote of the day</h2>
                    </div>
                    <div class="moti-quote">
                        <h2></h2>
                    </div>
                    <div class="moti-auth">
                        <h2></h2>
                    </div>

                </div>
            </div>

        </section>






    </div>
    <script src="script.js"></script>
</body>

</html>
